version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock_key}
      - LLM_PROVIDER=gemini
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHROMA_DB_DIR=./data/chroma
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
